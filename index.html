<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YummyLib</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Italianno&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
</head>
<body class="startPage">

    <div class="formBox">
        <h1>Mad Libs Story Generator</h1>
        <p>Enter your words to create a legendary story ✨</p>

        <input id="name" placeholder="Character name">
        <input id="dessert1" placeholder="A dessert">
        <input id="verb1" placeholder="Verb">
        <input id="adjective1" placeholder="Adjective">
        <input id="adverb1" placeholder="Adverb">
        <input id="food1" placeholder="A food">
        <input id="verb2" placeholder="Another verb">
        <input id="adjective2" placeholder="Another adjective">
        <input id="place" placeholder="A place">
        <input id="emotion" placeholder="An emotion">
        <input id="container" placeholder="A type of container">
        <input id="food2" placeholder="Another food">
        <input id="adjective3" placeholder="One more adjective">
        <input id="verb3" placeholder="One more verb">
        <input id="exclamation" placeholder="An exclamation">
        <input id="drink" placeholder="A drink">
        <input id="color" placeholder="A color">
        <input id="number" placeholder="A number">

        <button onclick="makeStory()">Create My Story</button>
    </div>
</body>
</html>
