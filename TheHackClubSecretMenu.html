<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YummyLib</title>
  <link rel="stylesheet" href="ChristmasKitchenChaos.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Italianno&display=swap" rel="stylesheet">
</head>

<body class="startPage">

  <div class="formBox">
      <h1>Mad Libs Story Generator</h1>
      <p>Enter your words to create a mysterious story 🤫 </p>

      <input id="name" placeholder="Name">
      <input id="snack" placeholder="A snack">
      <input id="codingVerb" placeholder="Coding verb (e.g. debug)">
      <input id="speedAdverb" placeholder="Adverb (how)">
      <input id="clubRole" placeholder="Hack Club role (e.g. leader)">
      <input id="room" placeholder="A room or place">
      <input id="feeling" placeholder="A feeling">
      <input id="container" placeholder="A container">
      <input id="surpriseFood" placeholder="Unexpected food">
      <input id="sound" placeholder="A sound">
      <input id="funVerb" placeholder="Fun verb">
      <input id="drink" placeholder="A drink">
      <input id="color" placeholder="A color">
      <input id="number" placeholder="A number">
      <input id="vibeAdjective" placeholder="An adjective (vibe)">

      <button onclick="makeStory()">Create My Story</button>
    </div>

    <div id="storyContainer" style="display:none;"></div>

    <script>
        function makeStory() {
          const inputs = document.querySelectorAll(".formBox input");

          for (let i = 0; i < inputs.length; i++) {
          if (inputs[i].value.trim() === "") {
          alert("Please fill in all the boxes before creating your story.");
          return; 
          }
        }

        const name = document.getElementById("name").value;
        const snack = document.getElementById("snack").value;
        const codingVerb = document.getElementById("codingVerb").value;
        const speedAdverb = document.getElementById("speedAdverb").value;
        const clubRole = document.getElementById("clubRole").value;
        const room = document.getElementById("room").value;
        const feeling = document.getElementById("feeling").value;
        const container = document.getElementById("container").value;
        const surpriseFood = document.getElementById("surpriseFood").value;
        const sound = document.getElementById("sound").value;
        const funVerb = document.getElementById("funVerb").value;
        const drink = document.getElementById("drink").value;
        const color = document.getElementById("color").value;
        const number = document.getElementById("number").value;
        const vibeAdjective = document.getElementById("vibeAdjective").value;

        document.querySelector(".formBox").style.display = "none";
      const storyDiv = document.getElementById("storyContainer");
      storyDiv.style.display = "flex";

      storyDiv.innerHTML = `
  <div class="storyBack">
    <div class="overlay">

      <h1>${name} and the Hack Club Secret Menu</h1>

        <p>At a Hack Club meeting in the <b>${room}</b>, <b>${name}</b> arrived feeling <b>${feeling}</b> and ready to code.</p>

        <p>The group decided to <b>${codingVerb}</b> <b>${speedAdverb}</b>, while the <b>${clubRole}</b> hinted at something mysterious.</p>

        <p>To unlock the club’s secret menu, everyone needed to bring <b>${number}</b> pieces of <b>${color}</b> <b>${snack}</b>.</p>

        <p>Inside a hidden <b>${container}</b>, they discovered an unexpected surprise: <b>${surpriseFood}</b>, causing everyone to shout "<b>${sound}</b>!"</p>

        <p>Fueled by <b>${drink}</b> and a <b>${vibeAdjective}</b> atmosphere, the team decided to <b>${funVerb}</b> until the project was finished.</p>

        <p><b>Hack Club rule confirmed: creativity runs on code, teamwork, and snacks.</b></p>

        <div class="buttonRow">
          <button onclick="playAgain()">Play Again</button>
          <button onclick="goHome()">Go Back to Home Page</button>
      </div>

    </div>
  </div>
`;
}

function playAgain() {
  document.querySelector(".formBox").style.display = "block";
  document.getElementById("storyContainer").style.display = "none";
}

function goHome() {
window.location.href = "index.html";
}
</script>

</body>
</html>
